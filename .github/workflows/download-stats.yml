# =============================================================================
# Compass — Download Statistics
#
# Runs nightly, on demand, and after every "Host Release Downloads" run (so a
# new release shows up within minutes instead of at the next nightly run) on
# the nginx self-hosted runner - the same box
# that serves privatecompass.app - and publishes a private download-count
# summary with zero external services:
#
#   1. GitHub per-version counts come straight from the Releases API
#      (`download_count` per asset - GitHub already tracks these).
#   2. Website counts come from Compass's own nginx access log
#      (/var/log/nginx/compass.access.log*, rotated .gz included). Requests
#      to the stable symlinks (Compass.exe/.msi/.dmg) are attributed to a
#      version using the hosted files' timestamps in /var/www/compass/downloads.
#      Ubuntu's logrotate only keeps ~2 weeks of logs, so parsed days are
#      merged into a state file in the runner user's home directory - history
#      accumulates from the day this workflow first runs.
#
# Counts are HTTP requests, not people or completed installs; the page lists
# exactly what is and is not counted (GitHub includes automated fetches).
#
# Where to look:
#   - https://privatecompass.app/stats/          hidden page (noindex, never
#     linked; rename via STATS_DIR below if you want it less guessable)
#   - The run's Actions summary tab              same table as Markdown
#   - Optional email                             enable the last step
#
# The stats page is written into the website git checkout as an UNTRACKED
# directory, so "Deploy Website"'s `git pull` never conflicts with it.
#
# ── ONE-TIME SERVER SETUP ─────────────────────────────────────────────
# No sudo is used here. Ubuntu keeps /var/log/nginx readable by the `adm`
# group, so grant the runner user membership once and restart the runner
# service so the new group applies to its sessions:
#
#   sudo usermod -aG adm $(whoami)
#   sudo systemctl restart 'actions.runner.*'   # or reboot the box
#
# (A NOPASSWD sudoers wildcard for cat/zcat is NOT a good alternative -
# sudoers glob arguments match `..` traversal and become a root file-read.)
#
# ── OPTIONAL EMAIL SETUP ─────────────────────────────────────────────────────
# Uncomment the "Email summary" step and add these repo secrets:
#   MAIL_SERVER    e.g. smtp.gmail.com
#   MAIL_PORT      e.g. 465
#   MAIL_USERNAME  the sending account
#   MAIL_PASSWORD  an app password (never your real password)
#   MAIL_TO        where the summary goes
# =============================================================================

name: Download Statistics

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC (odd minute avoids the cron rush)
  workflow_dispatch:
  # Refresh right after a release is hosted. Fires on the default branch's copy
  # of this file; the nightly schedule stays as the fallback if it ever doesn't.
  workflow_run:
    workflows: ["Host Release Downloads"]
    types: [completed]

# One run at a time: every run rewrites the same state file and its .bak copy.
concurrency:
  group: download-stats
  cancel-in-progress: false

permissions:
  contents: read # reads the releases API and checks out the script; nothing else

env:
  WEBSITE_PATH: /var/www/compass
  DOWNLOADS_DIR: /var/www/compass/downloads
  STATS_DIR: stats

jobs:
  stats:
    name: Tally downloads and publish stats page
    runs-on: [self-hosted, nginx]
    # A failed/cancelled hosting run changes nothing worth re-counting.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out repo (for the stats script)
        uses: actions/checkout@v4

      - name: Keep a copy of the accumulated state
        # The script never shrinks a recorded day and writes the state file
        # atomically; this copy is the restore point if a run goes wrong.
        run: |
          S="$HOME/.compass-download-stats-state.json"
          if [ -f "$S" ]; then cp -p "$S" "$S.bak"; fi

      - name: Generate stats page and summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WEB_ROOT: ${{ env.WEBSITE_PATH }}/website
          # Compass's own vhost log (compass.conf access_log), with rotated
          # .N and .N.gz files; read via `adm` group membership, no sudo.
          LOG_GLOB: /var/log/nginx/compass.access.log*
        run: |
          set -eo pipefail  # default runner bash has no pipefail; tee must not hide a failure
          python3 scripts/generate-download-stats.py | tee "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "Published to $WEB_ROOT/$STATS_DIR/index.html"

      # - name: Email summary
      #   uses: dawidd6/action-send-mail@v3
      #   with:
      #     server_address: ${{ secrets.MAIL_SERVER }}
      #     server_port: ${{ secrets.MAIL_PORT }}
      #     username: ${{ secrets.MAIL_USERNAME }}
      #     password: ${{ secrets.MAIL_PASSWORD }}
      #     subject: "Compass downloads — ${{ github.run_started_at }}"
      #     to: ${{ secrets.MAIL_TO }}
      #     from: Compass Stats
      #     convert_markdown: true
      #     html_body: file://${{ runner.temp }}/summary.md

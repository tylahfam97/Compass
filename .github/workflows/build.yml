name: Build Compass Installer

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'

  workflow_dispatch:

# Only one run per branch at a time on the shared, persistent self-hosted Windows runner
# (clean:false + a single bundle output dir means two overlapping runs could otherwise stomp on
# each other's src-tauri\target\release\bundle - e.g. a stale installer from an older run's
# version getting picked up mid-build by a newer run). A new push to the same branch cancels the
# older in-flight run rather than racing it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  create-compass:
    runs-on: [self-hosted, windows, server]

    defaults:
      run:
        shell: cmd

    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      is_prerelease: ${{ steps.vars.outputs.is_prerelease }}

    steps:
      - name: Prune stale local refs (self-hosted runner)
        # Deliberately kept inline (not extracted to scripts/) - this runs BEFORE "Checkout
        # repository" below, specifically to clean up git ref state that could otherwise make
        # checkout itself fail (e.g. a stale branch namespace directory blocking a branch ref).
        # A called script file wouldn't exist on disk yet at this point in a fresh/updated
        # checkout, so this one can't be modularized the same way as the steps after checkout.
        shell: powershell
        continue-on-error: true
        run: |
          if (Test-Path ".git") {
            # This persistent runner's working directory is owned by a different Windows
            # account than whatever the runner service currently runs as (e.g. after a runner
            # reinstall/account change) - git refuses to touch it ("detected dubious ownership
            # in repository at '...'") and every git command below would fail with exit code 1.
            # Registering it as a safe.directory is idempotent (skip if already present) and
            # fixes this permanently for this account, not just this run.
            $repoPath = $PWD.Path -replace '\\', '/'
            $safeDirs = git config --global --get-all safe.directory 2>$null
            if ($safeDirs -notcontains $repoPath) {
              Write-Host "Registering $repoPath as a safe.directory"
              git config --global --add safe.directory $repoPath
            }
            git remote prune origin 2>$null
            # Remove local branch namespace directories left by deleted namespaced branches
            # e.g. .git\refs\heads\dev\ (directory) blocks creating branch 'dev' (file)
            $headsPath = Resolve-Path ".git\refs\heads" -ErrorAction SilentlyContinue
            if ($headsPath) {
              Get-ChildItem -Path $headsPath.Path -Directory | ForEach-Object {
                Write-Host "Removing stale branch namespace: $($_.Name)/"
                Remove-Item -Recurse -Force $_.FullName
              }
            }
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This runner is a PERSISTENT self-hosted Windows VM, not an ephemeral GitHub-hosted
          # one - actions/checkout's default `clean: true` runs `git clean -ffdx` before every
          # checkout, which deletes src-tauri/target/ and node_modules/ (both gitignored) on
          # EVERY run. That wipes the SQLCipher/OpenSSL vendored-openssl C build (via nmake,
          # which doesn't parallelize) and all Rust dependency compilation, forcing a full
          # from-scratch rebuild every time regardless of runner CPU speed (this is what turned
          # a normally-incremental build into a 10+ minute one on a slower server CPU).
          # clean: false skips that wipe - tracked files are still correctly checked out/reset
          # to the right commit either way, only ignored/untracked build caches now persist.
          clean: false

      - name: Clean stale installer bundle output
        # clean:false above (deliberately) leaves src-tauri/target/ alone so Rust/OpenSSL/
        # SQLCipher compilation stays incremental. But that also means old installer files
        # from a PREVIOUS version never get deleted from
        # src-tauri\target\release\bundle\{msi,nsis}\ - tauri-bundler only ever ADDS the new
        # version's Compass_<version>_*.exe/.msi there, it doesn't remove prior ones. When two
        # versions' installers coexist, publish-release.ps1's
        # `Get-ChildItem *.msi | Select-Object -First 1` (no sort) enumerates alphabetically,
        # so an OLDER version (e.g. 0.9.2) can sort before and be picked/uploaded over a NEWER
        # one (0.9.3) even though the git tag/latest.json correctly say 0.9.3 - the published
        # exe/msi/nsis.zip silently mismatch the advertised version. That's exactly what
        # causes an infinite auto-update loop (users download an "update" whose actual code is
        # unchanged, so the version served by latest.json is still "newer" on the next check).
        # Deleting just the bundle output (not all of target/) keeps compile caches while
        # guaranteeing only the current build's installers exist to be uploaded.
        shell: powershell
        run: |
          if (Test-Path "src-tauri\target\release\bundle") {
            Write-Host "Removing stale src-tauri\target\release\bundle\ output from a previous build"
            Remove-Item -Recurse -Force "src-tauri\target\release\bundle"
          }

      - name: Ensure Rust/cargo is on PATH
        # On a self-hosted runner installed as a Windows service, the service process (and the
        # job steps it spawns) does NOT reliably inherit the interactive user's PATH - rustup
        # only adds %USERPROFILE%\.cargo\bin (or %CARGO_HOME%\bin) to the USER-level PATH, and
        # Windows services snapshot their environment at service-start time under whatever
        # account they run as. Symptom: `cargo -V` works fine over RDP, but `npm run tauri
        # build` fails with "failed to run command cargo metadata ...: program not found".
        #
        # This is a hard prerequisite, so a miss FAILS here rather than warning and letting the
        # build die four steps later with a message that points at Tauri instead of the cause.
        # Also probes every user profile, since rustup installs per-user: changing the runner
        # service account leaves the old account's Rust install stranded on disk.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @()
          if ($env:CARGO_HOME) { $candidates += (Join-Path $env:CARGO_HOME "bin") }
          if ($env:USERPROFILE) { $candidates += (Join-Path $env:USERPROFILE ".cargo\bin") }
          $candidates += "$env:SystemDrive\.cargo\bin"
          Get-ChildItem "$env:SystemDrive\Users" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { $candidates += (Join-Path $_.FullName ".cargo\bin") }
          $candidates = $candidates | Select-Object -Unique

          Write-Host "Runner identity: $env:USERDOMAIN\$env:USERNAME"
          Write-Host "Probing for cargo.exe in:"
          $candidates | ForEach-Object { Write-Host "  - $_" }

          $cargoBin = $candidates |
            Where-Object { Test-Path (Join-Path $_ "cargo.exe") } |
            Select-Object -First 1

          if (-not $cargoBin) {
            $onPath = Get-Command cargo -ErrorAction SilentlyContinue
            if ($onPath) { $cargoBin = Split-Path $onPath.Source -Parent }
          }

          if (-not $cargoBin) {
            Write-Host "::error::cargo.exe not found in any candidate location. Rust is not installed for this runner. Fix: RDP to the runner AS THE ACCOUNT THE RUNNER SERVICE RUNS AS and run rustup-init (https://rustup.rs) - a per-user install needing no admin rights - then restart the runner service. Full runner prerequisites: Rust (MSVC toolchain), Node >=24, VS Build Tools (C++ workload), Strawberry Perl, Git, .NET Desktop Runtime, Azure CLI."
            exit 1
          }

          Write-Host "Found cargo at $cargoBin - adding to PATH for subsequent steps"
          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin

          # If the install belongs to a DIFFERENT user profile, PATH alone isn't enough:
          # cargo.exe is a rustup shim that resolves its toolchain through RUSTUP_HOME, which
          # still points at this account's own (empty) %USERPROFILE%\.rustup. Point both homes
          # at the install actually found so the shim can resolve a toolchain.
          $cargoHomeFound = Split-Path $cargoBin -Parent
          $ownProfileCargo = if ($env:USERPROFILE) { Join-Path $env:USERPROFILE ".cargo" } else { "" }
          if ($cargoHomeFound -ne $ownProfileCargo) {
            Write-Host "cargo lives outside this account's profile - exporting CARGO_HOME=$cargoHomeFound"
            "CARGO_HOME=$cargoHomeFound" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
            $env:CARGO_HOME = $cargoHomeFound
            $rustupHome = Join-Path (Split-Path $cargoHomeFound -Parent) ".rustup"
            if (Test-Path $rustupHome) {
              Write-Host "Exporting RUSTUP_HOME=$rustupHome"
              "RUSTUP_HOME=$rustupHome" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
              $env:RUSTUP_HOME = $rustupHome
            }
          }

          # $GITHUB_PATH only affects LATER steps, so verify by absolute path here instead -
          # this proves the build step will work rather than assuming it.
          $cargoExe = Join-Path $cargoBin "cargo.exe"
          $version = & $cargoExe -V 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Found $cargoExe but it could not resolve a toolchain: $version. This usually means Rust belongs to a different Windows account. Cleanest fix: RDP in as the account the runner service runs as and run rustup-init (https://rustup.rs)."
            exit 1
          }
          Write-Host "cargo reports: $version"

          # artifact-signing-cli is installed with `cargo install`, so it lives in CARGO_HOME\bin
          # and follows the same profile as the toolchain - a fresh account has to rebuild it.
          if (-not (Test-Path (Join-Path $cargoBin "artifact-signing-cli.exe"))) {
            Write-Host "Note: artifact-signing-cli is not in $cargoBin yet - the signing step will cargo-install it, so this build will take longer than usual."
          }

      - name: Install frontend dependencies
        run: npm install

      - name: Read version and patch endpoint
        id: vars
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\read-version-and-patch-config.ps1

      - name: Ensure artifact-signing-cli is installed and enable Windows code signing
        shell: powershell
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: powershell -ExecutionPolicy Bypass -File scripts\enable-windows-code-signing.ps1

      - name: Build Tauri application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: powershell
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY is set (length: $($env:TAURI_SIGNING_PRIVATE_KEY.Length))"
          } else {
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY is NOT set - bundles will not be signed"
          }
          $cfg = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $pubkey   = $cfg.plugins.updater.pubkey
          $endpoint = $cfg.plugins.updater.endpoints[0]
          Write-Host "Updater pubkey set: $($null -ne $pubkey -and $pubkey -ne '')"
          Write-Host "Updater endpoint: $endpoint"
          npm run tauri build

      - name: Report Windows code signing status
        if: always()
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\report-windows-signing-status.ps1

      - name: Create and sign update bundle
        continue-on-error: true
        env:
          COMPASS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          COMPASS_SIGNING_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\create-update-bundle.ps1

      - name: Publish release to GitHub
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APPRISE_DISCORD_URL: ${{ secrets.AppriseDiscordUrl }}
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
        run: powershell -ExecutionPolicy Bypass -File scripts\publish-release.ps1

  # macOS build - fully independent of create-compass (only depends on it so the GitHub
  # release already exists to upload into). `continue-on-error: true` at the job level means
  # a broken/unsigned mac build NEVER marks the overall run red or affects the Windows
  # release above, which always builds/publishes on its own regardless of this job's outcome.
  build-macos:
    needs: create-compass
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm install

      - name: Read version, patch endpoint, compute tag
        shell: bash
        run: bash scripts/compute-version-and-tag.sh

      - name: Resolve Apple secrets (treat "N/A" placeholders as unset)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/resolve-apple-secrets.sh

      - name: Build (unsigned unless a real Apple signing identity is configured)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::No Apple signing identity configured - building an UNSIGNED macOS bundle. Populate the APPLE_* secrets with real values once available; no workflow changes needed."
          else
            echo "Apple signing identity configured - building a signed/notarized macOS bundle."
          fi
          npm run tauri build -- --target universal-apple-darwin

      - name: Upload macOS assets to the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APPRISE_DISCORD_URL: ${{ secrets.AppriseDiscordUrl }}
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
        run: pwsh -File scripts/publish-macos-assets.ps1

  # Hosts the release downloads (nginx server) - dispatched only once BOTH platform jobs have
  # concluded, the same way the Windows job only publishes/dispatches after ITS OWN build and
  # upload are done. `if: always()` means this still runs (and hosts the Windows .exe/.msi)
  # even if build-macos fails; `needs: build-macos` (not just create-compass) is what makes it
  # wait for the macOS upload attempt so host-release.yml can pick up the .dmg in the same run
  # instead of racing it via a premature dispatch from the Windows job.
  dispatch-host-release:
    name: Trigger release download hosting
    needs: [create-compass, build-macos]
    if: always() && needs.create-compass.result == 'success' && needs.create-compass.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dispatch host-release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-compass.outputs.tag_name }}
        run: bash scripts/dispatch-host-release.sh
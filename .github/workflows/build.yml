name: Build Compass Installer

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'

  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  create-compass:
    runs-on: [self-hosted, windows]

    defaults:
      run:
        shell: cmd

    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      is_prerelease: ${{ steps.vars.outputs.is_prerelease }}

    steps:
      - name: Prune stale local refs (self-hosted runner)
        shell: powershell
        continue-on-error: true
        run: |
          if (Test-Path ".git") {
            git remote prune origin 2>$null
            # Remove local branch namespace directories left by deleted namespaced branches
            # e.g. .git\refs\heads\dev\ (directory) blocks creating branch 'dev' (file)
            $headsPath = Resolve-Path ".git\refs\heads" -ErrorAction SilentlyContinue
            if ($headsPath) {
              Get-ChildItem -Path $headsPath.Path -Directory | ForEach-Object {
                Write-Host "Removing stale branch namespace: $($_.Name)/"
                Remove-Item -Recurse -Force $_.FullName
              }
            }
          }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm install

      - name: Read version and patch endpoint
        id: vars
        shell: powershell
        run: |
          # tauri.conf.json is the version source of truth — read it, don't overwrite it
          $v    = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $repo = $env:GITHUB_REPOSITORY
          # Export version for the publish script
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Mark as prerelease on any branch other than main
          $branch = $env:GITHUB_REF_NAME
          $isPrerelease = if ($branch -eq "main") { "false" } else { "true" }
          "IS_PRERELEASE=$isPrerelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Branch: $branch | Prerelease: $isPrerelease"
          # Tag name — mirrors publish-release.ps1's logic. Exposed as a job output so the
          # dispatch-host-release job (which runs after both platform jobs finish) can host
          # the exact tag without recomputing/duplicating this logic.
          $tagName = if ($isPrerelease -eq "true") {
            $sanitized = ($branch -replace '[^a-zA-Z0-9]', '-') -replace '-{2,}', '-'
            "v" + $v + "-" + $sanitized.Trim('-').ToLower()
          } else {
            "v" + $v
          }
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # Patch the updater endpoint placeholder
          (Get-Content src-tauri\tauri.conf.json -Raw) -replace '__REPO__', $repo |
            Set-Content src-tauri\tauri.conf.json -NoNewline
          # Keep Cargo.toml in sync
          (Get-Content src-tauri\Cargo.toml -Raw) `
            -replace '(?m)^version\s*=\s*"[^"]*"', ('version = "' + $v + '"') |
            Set-Content src-tauri\Cargo.toml -NoNewline
          Write-Host "Building version $v for $repo"

      - name: Ensure artifact-signing-cli is installed and enable Windows code signing
        shell: powershell
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          # Windows code signing via Azure Trusted Signing (optional) — only wired up once
          # an Azure Trusted Signing account + certificate profile exist AND the actual
          # credential secrets (AZURE_CLIENT_ID/SECRET/TENANT_ID) are populated. Any missing
          # piece falls back to an unsigned build exactly like before signing was wired in at
          # all, and signing turns on automatically the moment all 6 values exist - no
          # workflow changes needed.
          if (-not ($env:AZURE_SIGNING_ENDPOINT -and $env:AZURE_SIGNING_ACCOUNT -and $env:AZURE_SIGNING_PROFILE `
              -and $env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET -and $env:AZURE_TENANT_ID)) {
            Write-Warning "Azure Trusted Signing is not fully configured yet (variables and/or credential secrets missing) - the .exe/.msi will be unsigned (still shows an Unknown Publisher warning)"
            exit 0
          }

          # Install BEFORE resolving/patching signCommand below - on a fresh runner with no
          # cache, computing signCommand first (as this used to do) would bake in a reference
          # to a binary that doesn't exist on disk yet until this install step ran.
          # Cached/idempotent on this persistent self-hosted runner - a no-op after the first run.
          if (-not (Get-Command artifact-signing-cli -ErrorAction SilentlyContinue)) {
            Write-Host "Installing artifact-signing-cli..."
            cargo install artifact-signing-cli
          } else {
            Write-Host "artifact-signing-cli already installed"
          }

          # Resolve the CLI's fully-qualified path instead of relying on the bare command name
          # ("artifact-signing-cli") still being resolvable later, when Tauri's own bundler
          # (a separate Rust subprocess spawned from npm run tauri build) tries to run
          # signCommand - that subprocess's PATH isn't guaranteed to include ~/.cargo/bin on
          # every self-hosted runner/service context, and that's the most likely reason this
          # failed with "failed to run artifact-signing-cli" even with signing fully configured.
          $cli = Get-Command artifact-signing-cli -ErrorAction SilentlyContinue
          if (-not $cli) {
            Write-Warning "artifact-signing-cli install appears to have failed (not found on PATH after install) - leaving the build unsigned rather than failing it."
            exit 0
          }
          $cliPath = $cli.Source
          Write-Host "artifact-signing-cli resolved to: $cliPath"

          Write-Host "Azure Trusted Signing variables and credentials are all set - enabling Windows code signing"
          $cfg = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          if (-not $cfg.bundle.windows) {
            $cfg.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([PSCustomObject]@{}) -Force
          }
          # Route through scripts/sign-windows.ps1 instead of calling artifact-signing-cli
          # directly - having valid, non-empty secrets/variables does NOT guarantee the Azure
          # Trusted Signing account/certificate is actually active in Azure yet (auth can
          # succeed while the signing operation itself still fails). The wrapper always exits
          # 0 so a not-yet-active signing profile falls back to an unsigned build instead of
          # failing the whole workflow - see that script for details.
          #
          # Tauri's bundler spawns signCommand directly (not through a shell), splitting on
          # whitespace to find the program to run - it does NOT fall back to a PATH search the
          # way a normal shell invocation would in every runner/service context. Just like
          # artifact-signing-cli above, resolve powershell.exe's fully-qualified path instead of
          # relying on the bare "powershell" name - this is what "failed to run powershell"
          # meant (Tauri couldn't spawn the bare name), the same class of issue as before.
          $pwshCli = Get-Command powershell.exe -ErrorAction SilentlyContinue
          if (-not $pwshCli) {
            Write-Warning "powershell.exe could not be resolved on this runner - leaving the build unsigned rather than failing it."
            exit 0
          }
          $pwshPath = $pwshCli.Source
          $wrapperPath = (Resolve-Path "scripts\sign-windows.ps1").Path

          # Use the STRUCTURED { cmd, args } form instead of a single command-line string -
          # Tauri's Windows bundler does not appear to re-split a quoted string into argv the
          # way a shell would (a plain string here previously caused "os error 123: The
          # filename, directory name, or volume label syntax is incorrect", i.e. it likely
          # treated the whole quoted string as one literal path). Passing args as a JSON array
          # sidesteps quoting entirely - each element becomes exactly one argv entry, no
          # re-parsing involved.
          $signCommand = [PSCustomObject]@{
            cmd  = $pwshPath
            args = @(
              "-ExecutionPolicy", "Bypass",
              "-File", $wrapperPath,
              "-CliPath", $cliPath,
              "-Endpoint", $env:AZURE_SIGNING_ENDPOINT,
              "-Account", $env:AZURE_SIGNING_ACCOUNT,
              "-CertProfile", $env:AZURE_SIGNING_PROFILE,
              "-TargetPath", "%1"
            )
          }
          $cfg.bundle.windows | Add-Member -NotePropertyName signCommand -NotePropertyValue $signCommand -Force
          $cfg | ConvertTo-Json -Depth 32 | Set-Content src-tauri\tauri.conf.json -NoNewline
          Write-Host "signCommand configured: $($signCommand | ConvertTo-Json -Compress)"

      - name: Build Tauri application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: powershell
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY is set (length: $($env:TAURI_SIGNING_PRIVATE_KEY.Length))"
          } else {
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY is NOT set - bundles will not be signed"
          }
          $cfg = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $pubkey   = $cfg.plugins.updater.pubkey
          $endpoint = $cfg.plugins.updater.endpoints[0]
          Write-Host "Updater pubkey set: $($null -ne $pubkey -and $pubkey -ne '')"
          Write-Host "Updater endpoint: $endpoint"
          npm run tauri build

      - name: Report Windows code signing status
        if: always()
        shell: powershell
        run: |
          # Independently verifies (via Get-AuthenticodeSignature - ground truth, not just
          # trusting the sign-windows.ps1 wrapper's own self-report) whether the actual built
          # .exe ended up signed, and prints a result that's impossible to miss: a console
          # annotation (shows as a banner in the Actions UI) AND a GitHub Step Summary entry
          # (shows at the top of the run page, not buried in raw logs). Never fails the build -
          # this step is purely informational, and runs even if a prior step failed (`if:
          # always()`) so you always know the signing outcome either way.
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Warning "No built .exe found under src-tauri\target\release\bundle\nsis - skipping signing status check (build likely failed earlier)"
            exit 0
          }

          $statusFile = Join-Path $env:RUNNER_TEMP "compass-sign-status.txt"
          $attempted = if (Test-Path $statusFile) { Get-Content $statusFile -Raw } else { "(signing was not attempted - not fully configured for this run)" }

          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          if ($sig.Status -eq "Valid") {
            Write-Host "::notice title=Windows build is SIGNED::$($exe.Name) is Authenticode-signed by: $($sig.SignerCertificate.Subject)"
            "## ✅ Windows build is SIGNED`n`n**File:** $($exe.Name)`n**Signer:** $($sig.SignerCertificate.Subject)" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            Write-Warning "UNSIGNED - $($exe.Name) - Get-AuthenticodeSignature status: $($sig.Status) ($($sig.StatusMessage))"
            "## ⚠️ Windows build is UNSIGNED`n`n**File:** $($exe.Name)`n**Signature status:** $($sig.Status) - $($sig.StatusMessage)`n**Signing attempt log:** $attempted`n`nThe build itself succeeded - this is expected until Azure Trusted Signing is fully active in production, and does not need any action unless it's unexpected." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Create and sign update bundle
        continue-on-error: true
        env:
          COMPASS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          COMPASS_SIGNING_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: powershell
        run: |
          if (-not $env:COMPASS_SIGNING_KEY) { Write-Warning "No signing key - skipping"; exit 0 }

          # Skip if Tauri already created the bundle during build
          $existing = Get-ChildItem src-tauri\target\release\bundle\nsis\*.nsis.zip -ErrorAction SilentlyContinue
          if ($existing) { Write-Host "Update bundle already exists, skipping manual creation"; exit 0 }

          $nsisExe = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsisExe) { Write-Warning "No NSIS exe found - skipping"; exit 0 }

          $zipPath = $nsisExe.FullName -replace '\.exe$', '.nsis.zip'

          # Write a raw STORE (method 0) ZIP manually — .NET Framework 4.x always
          # produces Deflate (method 8) even with NoCompression, which the Tauri
          # updater's zip crate (compiled without the deflate feature) can't read.
          $fileBytes = [IO.File]::ReadAllBytes($nsisExe.FullName)
          $nameBytes = [Text.Encoding]::UTF8.GetBytes($nsisExe.Name)
          $fileSize  = [uint32]$fileBytes.Length

          # CRC-32 (decimal literals avoid PowerShell 5.1 sign-extension of large hex values)
          $poly     = [long]3988292384   # 0xEDB88320
          $mask32   = [long]4294967295   # 0xFFFFFFFF
          $crcTable = 0..255 | ForEach-Object {
              $c = [long]$_
              for ($j = 0; $j -lt 8; $j++) {
                  if ($c -band 1) { $c = $poly -bxor ($c -shr 1) }
                  else             { $c = $c -shr 1 }
              }
              $c -band $mask32
          }
          [long]$crc = 4294967295
          foreach ($b in $fileBytes) { $crc = $crcTable[($crc -bxor $b) -band 255] -bxor ($crc -shr 8) }
          [uint32]$crc = ($crc -bxor $mask32) -band $mask32

          $ms = [IO.MemoryStream]::new()
          $bw = [IO.BinaryWriter]::new($ms)

          # Local file header — method 0x0000 = STORE
          $bw.Write([uint32]0x04034B50); $bw.Write([uint16]20); $bw.Write([uint16]0)
          $bw.Write([uint16]0)                        # compression method: STORE
          $bw.Write([uint16]0); $bw.Write([uint16]0)  # mod time/date
          $bw.Write([uint32]$crc)
          $bw.Write([uint32]$fileSize); $bw.Write([uint32]$fileSize)
          $bw.Write([uint16]$nameBytes.Length); $bw.Write([uint16]0)
          $bw.Write($nameBytes)
          $bw.Write($fileBytes)   # data immediately follows LFH; LFH starts at offset 0

          # Central directory entry — offset field = start of local file header = 0
          $cdOffset = [uint32]$ms.Position
          $bw.Write([uint32]0x02014B50); $bw.Write([uint16]0x0314); $bw.Write([uint16]20)
          $bw.Write([uint16]0); $bw.Write([uint16]0)  # method: STORE
          $bw.Write([uint16]0); $bw.Write([uint16]0)
          $bw.Write([uint32]$crc)
          $bw.Write([uint32]$fileSize); $bw.Write([uint32]$fileSize)
          $bw.Write([uint16]$nameBytes.Length); $bw.Write([uint16]0); $bw.Write([uint16]0)
          $bw.Write([uint16]0); $bw.Write([uint16]0); $bw.Write([uint32]0)
          $bw.Write([uint32]0); $bw.Write($nameBytes)   # LFH offset = 0 (first entry)
          $cdSize = [uint32]($ms.Position - $cdOffset)

          # End of central directory
          $bw.Write([uint32]0x06054B50); $bw.Write([uint16]0); $bw.Write([uint16]0)
          $bw.Write([uint16]1); $bw.Write([uint16]1)
          $bw.Write([uint32]$cdSize); $bw.Write([uint32]$cdOffset); $bw.Write([uint16]0)
          $bw.Flush()

          [IO.File]::WriteAllBytes($zipPath, $ms.ToArray())
          Write-Host "Created STORE zip: $([IO.Path]::GetFileName($zipPath)) ($([math]::Round((Get-Item $zipPath).Length/1KB))KB)"

          # Write key to temp file under neutral name — TAURI_SIGNING_PRIVATE_KEY must NOT be set
          # or the CLI treats it as --private-key and conflicts with --private-key-path
          $keyFile = [IO.Path]::GetTempFileName()
          [IO.File]::WriteAllText($keyFile, $env:COMPASS_SIGNING_KEY)

          npx tauri signer sign --private-key-path $keyFile --password $env:COMPASS_SIGNING_PWD $zipPath
          Remove-Item $keyFile -Force -ErrorAction SilentlyContinue

          if (Test-Path "$zipPath.sig") {
            Write-Host "Signed - $([IO.Path]::GetFileName($zipPath)).sig created"
          } else {
            Write-Warning "tauri signer sign did not produce a .sig file"
          }

      - name: Publish release to GitHub
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APPRISE_DISCORD_URL: ${{ secrets.AppriseDiscordUrl }}
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
        run: powershell -ExecutionPolicy Bypass -File scripts\publish-release.ps1

  # macOS build - fully independent of create-compass (only depends on it so the GitHub
  # release already exists to upload into). `continue-on-error: true` at the job level means
  # a broken/unsigned mac build NEVER marks the overall run red or affects the Windows
  # release above, which always builds/publishes on its own regardless of this job's outcome.
  build-macos:
    needs: create-compass
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm install

      - name: Read version, patch endpoint, compute tag
        shell: bash
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then IS_PRERELEASE=false; else IS_PRERELEASE=true; fi
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          if [ "$IS_PRERELEASE" = "true" ]; then
            SANITIZED=$(echo "$BRANCH" | sed -E 's/[^a-zA-Z0-9]+/-/g; s/^-+|-+$//g' | tr 'A-Z' 'a-z')
            echo "TAG_NAME=v$V-$SANITIZED" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=v$V" >> "$GITHUB_ENV"
          fi
          node -e "
            const fs=require('fs'), p='src-tauri/tauri.conf.json';
            fs.writeFileSync(p, fs.readFileSync(p,'utf8').replace(/__REPO__/g, '${{ github.repository }}'));
          "
          echo "Building version $V for ${{ github.repository }}"

      - name: Resolve Apple secrets (treat "N/A" placeholders as unset)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Until a real Apple Developer ID is plugged in, these secrets are placeholder "N/A"
          # values - normalize them (and any blank/whitespace-only value) to being genuinely
          # UNSET, not just an empty string. Tauri's bundler checks whether e.g.
          # APPLE_CERTIFICATE is *present* in the environment at all - an empty string still
          # counts as "present", so it still tries (and fails) to import an empty certificate
          # into the keychain. Skipping the export line entirely leaves the var truly absent.
          # Swapping in real secret values later needs no workflow changes - this step just
          # passes them through unchanged once they're real.
          for VAR in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            VAL="${!VAR}"
            NORMALIZED=$(echo "$VAL" | tr '[:upper:]' '[:lower:]' | xargs)
            if [ -n "$NORMALIZED" ] && [ "$NORMALIZED" != "n/a" ]; then
              echo "$VAR=$VAL" >> "$GITHUB_ENV"
            fi
            # else: real value missing/"N/A" - intentionally do NOT export anything, leaving
            # the var genuinely unset (not just empty) for the build step below.
          done

      - name: Build (unsigned unless a real Apple signing identity is configured)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::No Apple signing identity configured - building an UNSIGNED macOS bundle. Populate the APPLE_* secrets with real values once available; no workflow changes needed."
          else
            echo "Apple signing identity configured - building a signed/notarized macOS bundle."
          fi
          npm run tauri build -- --target universal-apple-darwin

      - name: Upload macOS assets to the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APPRISE_DISCORD_URL: ${{ secrets.AppriseDiscordUrl }}
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
        run: pwsh -File scripts/publish-macos-assets.ps1

  # Hosts the release downloads (nginx server) - dispatched only once BOTH platform jobs have
  # concluded, the same way the Windows job only publishes/dispatches after ITS OWN build and
  # upload are done. `if: always()` means this still runs (and hosts the Windows .exe/.msi)
  # even if build-macos fails; `needs: build-macos` (not just create-compass) is what makes it
  # wait for the macOS upload attempt so host-release.yml can pick up the .dmg in the same run
  # instead of racing it via a premature dispatch from the Windows job.
  dispatch-host-release:
    name: Trigger release download hosting
    needs: [create-compass, build-macos]
    if: always() && needs.create-compass.result == 'success' && needs.create-compass.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch host-release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-compass.outputs.tag_name }}
        run: |
          echo "Dispatching host-release.yml for $TAG_NAME"
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/host-release.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"tag_name\":\"$TAG_NAME\"}}"
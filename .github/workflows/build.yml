name: Build Compass Installer

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'

  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  create-compass:
    runs-on: [self-hosted, windows]

    defaults:
      run:
        shell: cmd

    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      is_prerelease: ${{ steps.vars.outputs.is_prerelease }}

    steps:
      - name: Prune stale local refs (self-hosted runner)
        # Deliberately kept inline (not extracted to scripts/) - this runs BEFORE "Checkout
        # repository" below, specifically to clean up git ref state that could otherwise make
        # checkout itself fail (e.g. a stale branch namespace directory blocking a branch ref).
        # A called script file wouldn't exist on disk yet at this point in a fresh/updated
        # checkout, so this one can't be modularized the same way as the steps after checkout.
        shell: powershell
        continue-on-error: true
        run: |
          if (Test-Path ".git") {
            git remote prune origin 2>$null
            # Remove local branch namespace directories left by deleted namespaced branches
            # e.g. .git\refs\heads\dev\ (directory) blocks creating branch 'dev' (file)
            $headsPath = Resolve-Path ".git\refs\heads" -ErrorAction SilentlyContinue
            if ($headsPath) {
              Get-ChildItem -Path $headsPath.Path -Directory | ForEach-Object {
                Write-Host "Removing stale branch namespace: $($_.Name)/"
                Remove-Item -Recurse -Force $_.FullName
              }
            }
          }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm install

      - name: Read version and patch endpoint
        id: vars
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\read-version-and-patch-config.ps1

      - name: Ensure artifact-signing-cli is installed and enable Windows code signing
        shell: powershell
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: powershell -ExecutionPolicy Bypass -File scripts\enable-windows-code-signing.ps1

      - name: Build Tauri application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: powershell
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY is set (length: $($env:TAURI_SIGNING_PRIVATE_KEY.Length))"
          } else {
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY is NOT set - bundles will not be signed"
          }
          $cfg = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $pubkey   = $cfg.plugins.updater.pubkey
          $endpoint = $cfg.plugins.updater.endpoints[0]
          Write-Host "Updater pubkey set: $($null -ne $pubkey -and $pubkey -ne '')"
          Write-Host "Updater endpoint: $endpoint"
          npm run tauri build

      - name: Report Windows code signing status
        if: always()
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\report-windows-signing-status.ps1

      - name: Create and sign update bundle
        continue-on-error: true
        env:
          COMPASS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          COMPASS_SIGNING_PWD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\create-update-bundle.ps1

      - name: Publish release to GitHub
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APPRISE_DISCORD_URL: ${{ secrets.AppriseDiscordUrl }}
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
        run: powershell -ExecutionPolicy Bypass -File scripts\publish-release.ps1

  # macOS build - fully independent of create-compass (only depends on it so the GitHub
  # release already exists to upload into). `continue-on-error: true` at the job level means
  # a broken/unsigned mac build NEVER marks the overall run red or affects the Windows
  # release above, which always builds/publishes on its own regardless of this job's outcome.
  build-macos:
    needs: create-compass
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm install

      - name: Read version, patch endpoint, compute tag
        shell: bash
        run: bash scripts/compute-version-and-tag.sh

      - name: Resolve Apple secrets (treat "N/A" placeholders as unset)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/resolve-apple-secrets.sh

      - name: Build (unsigned unless a real Apple signing identity is configured)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::No Apple signing identity configured - building an UNSIGNED macOS bundle. Populate the APPLE_* secrets with real values once available; no workflow changes needed."
          else
            echo "Apple signing identity configured - building a signed/notarized macOS bundle."
          fi
          npm run tauri build -- --target universal-apple-darwin

      - name: Upload macOS assets to the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APPRISE_DISCORD_URL: ${{ secrets.AppriseDiscordUrl }}
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
        run: pwsh -File scripts/publish-macos-assets.ps1

  # Hosts the release downloads (nginx server) - dispatched only once BOTH platform jobs have
  # concluded, the same way the Windows job only publishes/dispatches after ITS OWN build and
  # upload are done. `if: always()` means this still runs (and hosts the Windows .exe/.msi)
  # even if build-macos fails; `needs: build-macos` (not just create-compass) is what makes it
  # wait for the macOS upload attempt so host-release.yml can pick up the .dmg in the same run
  # instead of racing it via a premature dispatch from the Windows job.
  dispatch-host-release:
    name: Trigger release download hosting
    needs: [create-compass, build-macos]
    if: always() && needs.create-compass.result == 'success' && needs.create-compass.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dispatch host-release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-compass.outputs.tag_name }}
        run: bash scripts/dispatch-host-release.sh
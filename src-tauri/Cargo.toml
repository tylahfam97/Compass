[package]
name = "compass"
version = "0.9.3"
description = "Compass – Personal Finance Companion"
authors = ["Tyler Fameli"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
# keyring v3+ requires an explicit backend feature per platform - without one it silently
# falls back to an in-memory "mock" store that's discarded on process exit (see
# https://docs.rs/keyring, "Upgrading from v2"). Without this, load_or_create_key() in lib.rs
# would report "Keyring entry missing" and restore from the compass.key file backup on every
# single launch, since nothing was ever actually persisted to Windows Credential Manager /
# macOS Keychain in the first place.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
